    hypothesis: 规则判分与 LLM 判断的一致率应 >0.85，且偏差方向应可解释
    expected: {}
    cost: 低（30 次本地推理，约 2 分钟）
    risk: LLM 裁判本身也会偏松（语义覆盖但措辞不同），不能反过来当真理
    status: adopted
    note: >
