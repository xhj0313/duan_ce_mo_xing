      **偏严 4 次、偏松 0 次**——规则判分系统性偏严，报告中的 faq 命中率可能低估 5-10pt
      （4B 0.740 的真实值大概率在 0.78-0.82）。典型分歧：'改密码不收费' vs '不收取费用'（同义未归一）、
