      误路由样本的正确卡分数普遍只有 0.29~0.50，所以初版门槛（0.45/0.55）触发 0 次——**门槛要按实测分布定，不能拍**。
      **实测（评测-39/40）：净收益 0**。4B v2 0.788 / v3 0.827、1.7B v2 0.606，与 F2 完全一致。
      原因：被救的 3 行本来已命中（F2 短路在原卡上就覆盖了要点），换卡无增量。
      代码已回退（每请求多读 3-5 张卡是纯成本）。
      附带发现：两轮同配置的 intent_route_ok 从 0.835 漂到 0.868（1.7B 0.681→0.747），
      而 F4 不改意图 —— 说明 **llama.cpp 同配置重跑存在 ±3pt 波动**，<3pt 的差异不可信。

