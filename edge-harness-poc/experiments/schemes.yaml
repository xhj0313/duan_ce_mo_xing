      - run_experiment.py 支持 --infra（无指标的基础设施记录）
    hypothesis: 把已采纳行为固化为断言，后续改动可秒级回归
    expected: {}
    cost: 低（一次性）
    risk: 断言需随方案演进同步更新，否则会误报
    status: adopted
    note: >
      实现并跑通（评测-30）：6 组断言全过。覆盖 T5 主体/外泄拦截、I5 OOS 与安全常识纠偏、
      T1b 参数校验（含"十万/三万五"中文数字）、C1 脱敏（Luhn + 脏输出过滤 + 文本重建）、
      F1 JSON 解析、注册表一致性。顺带修正 X2 的 env 记账（pc→pc4b）。
