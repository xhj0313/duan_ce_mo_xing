      I1 修完注册表后示例已可移除。端侧每次请求少 prefill 约 1000 字符，预计省 1-2 秒。

  - id: F4
    title: 跨卡路由兜底（当前卡几乎不匹配时切到更匹配的卡）
    target: [faq.info_point_hit]
    why: >
      FAQ 剩余缺口里约 16.5% 是"问题被路由到错误知识卡"，用对的卡作答就能救回来。
    change:
