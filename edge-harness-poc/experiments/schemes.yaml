    hypothesis: 门槛从严时误切率可压到 0，救回少量误路由
    expected: {faq.info_point_hit: "+1~3pt"}
    cost: 低（纯代码，加载 3-5 张小卡）
    risk: A1 已证明字符相似度不可靠 → 宽松阈值会把对的切错
